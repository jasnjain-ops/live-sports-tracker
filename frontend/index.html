<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Sports Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏆 Live Sports Tracker</h1>
        <p>Follow live matches, teams and players</p>
    </header>

    <main>

        <section class="sports">

            <h2>Sports</h2>

            <button onclick="selectSport('football')">
                ⚽ Football
            </button>

            <button onclick="selectSport('cricket')">
                🏏 Cricket
            </button>

            <button onclick="selectSport('basketball')">
                🏀 Basketball
            </button>

            <button onclick="selectSport('tennis')">
                🎾 Tennis
            </button>

            <button onclick="selectSport('f1')">
                🏎️ Formula 1
            </button>

        </section>


        <section class="matches">

            <div class="matches-header">

                <h2 id="matches-title">
                    Live Matches
                </h2>

                <button
                    id="football-refresh"
                    class="football-refresh">
                    🔄 Refresh
                </button>

            </div>


            <div
                id="football-search-container"
                class="football-search-container">

                <input
                    type="text"
                    id="football-search"
                    placeholder="🔍 Search team name..."
                    autocomplete="off"
                >

            </div>


            <div id="match-list">

                <p class="loading">
                    Select a sport to load matches...
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
