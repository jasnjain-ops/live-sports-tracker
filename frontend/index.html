<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Sports Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏆 Live Sports Tracker</h1>
        <p>Follow live matches, teams and players</p>
    </header>

    <main>

        <section class="sports">
            <h2>Sports</h2>

            <button>⚽ Football</button>
            <button>🏏 Cricket</button>
            <button>🏀 Basketball</button>
            <button>🎾 Tennis</button>
        </section>


        <section class="matches">

            <h2>Live Matches</h2>

            <div class="match-card">

                <div>
                    <h3>Team A</h3>
                    <p>2</p>
                </div>

                <div class="live">
                    🔴 LIVE
                </div>

                <div>
                    <h3>Team B</h3>
                    <p>1</p>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
